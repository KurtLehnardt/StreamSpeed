<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamSpeed</title>
    <style>
        :root {
            color-scheme: light dark;
        }
        html, body {
            margin: 0;
            padding: 0;
        }
        body {
            width: 260px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: #1a1a1a;
            background: #ffffff;
            padding: 12px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 10px 0;
        }
        .ss-row {
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
        }
        select {
            width: 100%;
            padding: 5px 6px;
            font-size: 13px;
            box-sizing: border-box;
        }
        .ss-check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
            margin: 0;
        }
        .ss-check input {
            margin: 0;
        }
        button {
            width: 100%;
            padding: 7px 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #c7c7c7;
            border-radius: 5px;
            background: #f4f4f4;
            color: #1a1a1a;
            cursor: pointer;
            box-sizing: border-box;
        }
        button:hover {
            background: #e9e9e9;
        }
        #ssEscape {
            border-color: #d9534f;
            color: #c9302c;
        }
        #ssEscape:hover {
            background: #fdecea;
        }
        .ss-note {
            font-size: 11px;
            color: #666;
            margin: 8px 0 0 0;
        }
        @media (prefers-color-scheme: dark) {
            body {
                color: #ececec;
                background: #232323;
            }
            select, button {
                background: #333;
                color: #ececec;
                border-color: #555;
            }
            button:hover {
                background: #3d3d3d;
            }
            #ssEscape {
                border-color: #e57373;
                color: #ef9a9a;
            }
            #ssEscape:hover {
                background: #40302f;
            }
            .ss-note {
                color: #aaa;
            }
        }
    </style>
</head>
<body>
    <h1>StreamSpeed</h1>

    <div class="ss-row">
        <label for="ssMode">Ad mode</label>
        <select id="ssMode">
            <option value="off">Off</option>
            <option value="speed">Speed</option>
            <option value="breathing">Breathing</option>
        </select>
    </div>

    <div class="ss-row">
        <label class="ss-check" for="ssAutoSkip">
            <input type="checkbox" id="ssAutoSkip">
            Auto-skip ads when possible
        </label>
    </div>

    <div class="ss-row">
        <button id="ssEscape" type="button">Stop ad mode now</button>
    </div>

    <div class="ss-row">
        <button id="ssOptions" type="button">More settings</button>
    </div>

    <p class="ss-note">
        Opening this popup activates the classic speed &amp; volume slider on the
        current tab. Quick controls above stay available while the slider is open.
    </p>

    <script src="content/settings.js"></script>
    <script src="popup.js"></script>
</body>
</html>
